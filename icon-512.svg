<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1026"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    <linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="#00f0ff" stroke-width="6" opacity="0.4"/>

  <!-- 六角形サイバーフレーム -->
  <polygon points="256,60 420,155 420,345 256,440 92,345 92,155" fill="none" stroke="#00f0ff" stroke-width="8" opacity="0.3"/>

  <!-- 光るブレード（剣）クロスデザイン -->
  <g filter="url(#glow)">
    <!-- 剣1 -->
    <path d="M160 380 L340 120 L360 140 L180 400 Z" fill="url(#blade)"/>
    <!-- 剣2 -->
    <path d="M352 380 L172 120 L152 140 L332 400 Z" fill="url(#blade)"/>
    <!-- 中央コア -->
    <circle cx="256" cy="256" r="36" fill="#ff0055"/>
    <circle cx="256" cy="256" r="20" fill="#ffffff"/>
  </g>
</svg>
